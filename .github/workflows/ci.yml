name: CI

on:
  push:
    branches:
      - main
      - 'phase/**'
      - 'task/**'
      - 'fix/**'
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24.14.0
          cache: pnpm

      - name: Record runner baseline
        run: |
          uname -a
          node --version
          pnpm --version

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Verify
        run: pnpm check
